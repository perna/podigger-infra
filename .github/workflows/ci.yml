name: Infrastructure CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infra-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Show Docker Compose version
        run: docker compose version
      - name: Validate local integration Compose
        run: docker compose -f docker-compose.integration.yml config --quiet
      - name: Validate staging Compose
        run: docker compose --env-file .env.example -f docker-compose.staging.yml config --quiet
      - name: Assert staging Celery healthcheck timeout
        run: |
          timeout="$(docker compose --env-file .env.example -f docker-compose.staging.yml config --format json | python3 -c 'import json,sys; print(json.load(sys.stdin)["services"]["celery-staging"]["healthcheck"]["timeout"])')"
          if [ "$timeout" != "45s" ]; then
            echo "::error::Staging Celery healthcheck timeout is $timeout; expected 45s."
            exit 1
          fi
      - name: Assert staging frontend healthcheck uses Node
        run: |
          docker compose --env-file .env.example -f docker-compose.staging.yml config --format json |
          python3 -c 'import json,sys; test=" ".join(json.load(sys.stdin)["services"]["frontend-staging"]["healthcheck"]["test"]); assert "node" in test and "/api/health" in test and "curl" not in test, test; print("Staging frontend healthcheck uses Node.")'
      - name: Validate production Compose
        run: docker compose --env-file .env.example -f docker-compose.production.yml config --quiet
