name: Deploy staging application image

on:
  repository_dispatch:
    types: [application-image-published]
  workflow_dispatch:
    inputs:
      service:
        required: true
        type: choice
        options: [backend, frontend]
      image:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: podigger-staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'repository_dispatch' && github.event.client_payload.environment == 'staging')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    steps:
      - name: Validate staging deploy configuration
        env:
          SERVICE: ${{ github.event.client_payload.service || inputs.service }}
          IMAGE: ${{ github.event.client_payload.image || inputs.image }}
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_KNOWN_HOSTS: ${{ vars.VPS_KNOWN_HOSTS }}
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          for name in VPS_HOST VPS_USER VPS_KNOWN_HOSTS GHCR_USERNAME GHCR_TOKEN VPS_SSH_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing staging environment variable or secret: $name"
              exit 1
            fi
          done

          case "$SERVICE" in
            backend)
              [[ "$IMAGE" =~ ^ghcr\.io/perna/podigger-django-backend:(develop|sha-[0-9a-f]{40})$ ]] || {
                echo "::error::Image is not an allowed backend staging tag."
                exit 1
              }
              ;;
            frontend)
              [[ "$IMAGE" =~ ^ghcr\.io/perna/podigger-nextjs-frontend:(develop|sha-[0-9a-f]{40})$ ]] || {
                echo "::error::Image is not an allowed frontend staging tag."
                exit 1
              }
              ;;
            *) echo "::error::Unsupported staging service: $SERVICE"; exit 1 ;;
          esac

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Install pinned VPS host key
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_KNOWN_HOSTS: ${{ vars.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -F "$VPS_HOST" -f ~/.ssh/known_hosts >/dev/null

      - name: Sync staging Compose manifests
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
        run: |
          scp -o StrictHostKeyChecking=yes \
            docker-compose.base.yml docker-compose.staging.yml \
            "$VPS_USER@$VPS_HOST:/opt/podigger-staging/"

      - name: Deploy staging image
        env:
          SERVICE: ${{ github.event.client_payload.service || inputs.service }}
          IMAGE: ${{ github.event.client_payload.image || inputs.image }}
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          set -euo pipefail
          trap 'ssh "$VPS_USER@$VPS_HOST" "docker logout ghcr.io" >/dev/null 2>&1 || true' EXIT

          printf '%s\n' "$GHCR_TOKEN" | ssh "$VPS_USER@$VPS_HOST" \
            "docker login ghcr.io -u '$GHCR_USERNAME' --password-stdin"

          ssh "$VPS_USER@$VPS_HOST" bash -s -- "$SERVICE" "$IMAGE" <<'ENDSSH'
          set -eu
          SERVICE="$1"
          IMAGE="$2"
          ROOT="/opt/podigger-staging"
          COMPOSE="docker-compose.staging.yml"
          cd "$ROOT"

          case "$SERVICE" in
            backend)
              sed -i "s#^BACKEND_IMAGE=.*#BACKEND_IMAGE=$IMAGE#" .env
              docker compose -f "$COMPOSE" pull backend-staging celery-staging celery-beat-staging
              docker compose -f "$COMPOSE" up -d db-staging redis-staging
              docker compose -f "$COMPOSE" run --rm backend-staging python manage.py migrate --noinput
              docker compose -f "$COMPOSE" run --rm backend-staging python manage.py collectstatic --noinput
              docker compose -f "$COMPOSE" up -d --wait backend-staging celery-staging celery-beat-staging
              ;;
            frontend)
              sed -i "s#^FRONTEND_IMAGE=.*#FRONTEND_IMAGE=$IMAGE#" .env
              docker compose -f "$COMPOSE" pull frontend-staging
              docker compose -f "$COMPOSE" up -d --wait frontend-staging
              test -s /opt/podigger-proxy/certs/cloudflare.crt
              test -s /opt/podigger-proxy/certs/cloudflare.key
              docker compose -f /opt/podigger-proxy/docker-compose.yml run --rm --no-deps nginx-proxy nginx -t
              docker compose -f /opt/podigger-proxy/docker-compose.yml up -d nginx-proxy
              ;;
            *)
              echo "Unknown service: $SERVICE" >&2
              exit 1
              ;;
          esac
          ENDSSH
