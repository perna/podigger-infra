# Full local integration stack. Expects the three repositories as siblings:
# podigger-infra/, podigger-django-backend/, and podigger-nextjs-frontend/.
name: podigger-local-integration

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: podigger
      POSTGRES_USER: docker
      POSTGRES_PASSWORD: docker
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docker -d podigger"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: podigger-local-integration-backend:local
    build:
      context: ../podigger-django-backend
      dockerfile: Dockerfile
    command: >-
      sh -c "python manage.py migrate --noinput &&
      gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2"
    environment:
      DJANGO_SECRET_KEY: local-integration-only-secret
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: "*"
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      DATABASE_NAME: podigger
      DATABASE_USER: docker
      DATABASE_PASSWORD: docker
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  celery-worker:
    image: podigger-local-integration-backend:local
    command: celery -A config worker --loglevel=info --concurrency=2
    environment:
      DJANGO_SECRET_KEY: local-integration-only-secret
      DJANGO_DEBUG: "True"
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      DATABASE_NAME: podigger
      DATABASE_USER: docker
      DATABASE_PASSWORD: docker
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  celery-beat:
    image: podigger-local-integration-backend:local
    command: celery -A config beat --loglevel=info
    environment:
      DJANGO_SECRET_KEY: local-integration-only-secret
      DJANGO_DEBUG: "True"
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      DATABASE_NAME: podigger
      DATABASE_USER: docker
      DATABASE_PASSWORD: docker
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      disable: true

  frontend:
    build:
      context: ../podigger-nextjs-frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-8000}
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  db_data:
    name: podigger-local-integration-db
